version: '3.9'
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./media:/app/backend/media
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
