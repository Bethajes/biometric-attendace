{% if is_paginated %}
<div class="pagination">
    {% if page_obj.has_previous %}
        <a class="button subtle" href="?page={{ page_obj.previous_page_number }}">&lt;</a>
    {% endif %}
    <span class="button">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="button subtle" href="?page={{ page_obj.next_page_number }}">&gt;</a>
    {% endif %}
</div>
{% endif %}
