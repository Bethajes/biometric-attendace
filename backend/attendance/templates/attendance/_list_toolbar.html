<form class="filter-bar" method="get">
    <label>Search
        <input name="q" value="{{ request.GET.q }}" placeholder="Search records">
    </label>
    {% block filters %}{% endblock %}
    <button class="button primary" type="submit">Apply</button>
    <a class="button subtle" href="{{ request.path }}">Reset</a>
    <div class="table-actions">
        <a class="button" href="?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}export=csv">CSV</a>
        <a class="button" href="?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}export=excel">Excel</a>
        <a class="button" href="?{{ request.GET.urlencode }}{% if request.GET.urlencode %}&{% endif %}export=pdf">PDF</a>
    </div>
</form>
