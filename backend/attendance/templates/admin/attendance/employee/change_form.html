{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
  {{ block.super }}
  {% if original and original.pk %}
    <li>
      <form method="post" action="{% url 'admin:attendance_employee_enroll_fingerprint' original.pk %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="button" style="background:#0b57d0;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">
          Enroll Fingerprint
        </button>
      </form>
    </li>
  {% endif %}
{% endblock %}
